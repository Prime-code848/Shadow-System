<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shadow System - Level 200</title>
  <style>
    :root { --bg: #0a0a0a; --accent: #00ff9d; --text: #e0e0e0; }
    body {
      margin: 0; padding: 20px; font-family: 'Segoe UI', sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh;
    }
    .container { max-width: 920px; margin: 0 auto; }
    h1 { color: var(--accent); text-align: center; margin-bottom: 10px; }
    .level { text-align: center; font-size: 2.2rem; margin: 10px 0; }
    .progress-bar { height: 12px; background: #333; border-radius: 6px; overflow: hidden; margin: 15px 0; }
    .progress { height: 100%; background: var(--accent); width: 0%; transition: width 0.6s ease; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin: 30px 0; }
    .stat { background: #1a1a1a; padding: 15px; border-radius: 8px; border: 1px solid #333; }
    .stat-name { color: var(--accent); font-size: 0.9rem; }
    .stat-value { font-size: 1.8rem; font-weight: bold; }
    .quests { background: #1a1a1a; padding: 20px; border-radius: 8px; border: 1px solid #333; margin-bottom: 25px; }
    .quest-item { padding: 12px; background: #222; margin-bottom: 10px; border-radius: 6px; display: flex; align-items: center; gap: 12px; }
    button {
      background: var(--accent); color: black; border: none; padding: 12px 24px;
      border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 15px;
    }
    button:hover { background: #00cc7a; }
    .reset-btn { background: #444; color: white; }
  </style>
</head>
<body>
  <div class="container">
    <h1>SHADOW SYSTEM</h1>
    <div class="level">Level <span id="level">200</span></div>
    <div>Progress: <span id="progress-text">0</span>/100</div>
    <div class="progress-bar"><div id="progress-bar" class="progress"></div></div>

    <div class="stats" id="stats-container"></div>

    <h2 style="color: var(--accent);">Daily Quests</h2>
    <div class="quests" id="quests-container"></div>

    <h2 style="color: var(--accent);">Weekly Quest</h2>
    <div class="quests" id="weekly-container"></div>

    <button onclick="completeDay()">Complete Daily Quests & Save</button>
    <button onclick="completeWeekly()" style="margin-left:10px;">Claim Weekly Quest</button>
    <button class="reset-btn" onclick="resetProgress()" style="margin-left:10px;">Reset All Progress</button>

    <p style="text-align:center; margin-top:30px; font-size:0.9rem; color:#666;">
      Quests now persist correctly. Host on GitHub Pages for access anywhere.
    </p>
  </div>

  <script>
    let player = {
      level: 200,
      progress: 0,
      stats: {
        Programming: 10,
        "Hacking & Cybersecurity": 10,
        "Trading & Financial Intelligence": 10,
        "Self-Development": 10
      },
      dailyQuests: [
        { id: 1, text: "Programming: 45+ minutes focused coding / project work", completed: false },
        { id: 2, text: "Hacking: 30+ minutes study or practical exercise", completed: false },
        { id: 3, text: "Trading: Review charts + journal one trade idea or lesson", completed: false }
      ],
      currentSelfQuests: [],
      selfDevPool: [
        "Mental/Cognitive: Read 1 chapter of a technical or non-fiction book",
        "Mental/Cognitive: Solve one LeetCode / algorithm problem",
        "Mental/Cognitive: Learn one new concept (e.g., design pattern, probability)",
        "Emotional: 10+ minutes meditation or breathing exercise",
        "Emotional: Gratitude journaling (3 things)",
        "Emotional: Review one past failure and extract a lesson",
        "Spiritual: Read Bible or spiritual text for 15 minutes",
        "Spiritual: Listen to a sermon/podcast and reflect",
        "Spiritual: Practice prayer or mindful reflection",
        "Character: Practice discipline (no distractions during focus blocks)",
        "Character: Act with integrity in one decision today",
        "Character: Show patience in a challenging situation",
        "Social: Reach out to one contact or network meaningfully",
        "Social: Share one valuable insight publicly (LinkedIn/X)",
        "Social: Practice active listening in a conversation",
        "Skill: Play one focused game of Chess and analyse it",
        "Skill: Practice public speaking (record 2-minute talk)",
        "Skill: Work on a personal portfolio or side project"
      ],
      weeklyQuest: { text: "Complete 5+ daily quests for at least 5 days this week + finish one major milestone (e.g. coding module or trading backtest)", completed: false }
    };

    function saveData() {
      localStorage.setItem('shadowSystem', JSON.stringify(player));
    }

    function loadData() {
      const saved = localStorage.getItem('shadowSystem');
      if (saved) player = JSON.parse(saved);
    }

    function generateNewSelfQuests() {
      const shuffled = [...player.selfDevPool].sort(() => 0.5 - Math.random());
      player.currentSelfQuests = shuffled.slice(0, 5).map((text, idx) => ({
        id: 100 + idx,
        text: text,
        completed: false
      }));
    }

    function renderStats() {
      const container = document.getElementById('stats-container');
      container.innerHTML = '';
      Object.keys(player.stats).forEach(stat => {
        const div = document.createElement('div');
        div.className = 'stat';
        div.innerHTML = `<div class="stat-name">${stat}</div><div class="stat-value">${player.stats[stat]}</div>`;
        container.appendChild(div);
      });
    }

    function renderQuests() {
      const container = document.getElementById('quests-container');
      container.innerHTML = '';

      // Fixed Daily Quests
      player.dailyQuests.forEach((quest, index) => {
        const div = document.createElement('div');
        div.className = 'quest-item';
        div.innerHTML = `<input type="checkbox" ${quest.completed ? 'checked' : ''} onchange="toggleQuest(${index}, 'daily')"> <span>${quest.text}</span>`;
        container.appendChild(div);
      });

      // Self-Development Quests
      if (player.currentSelfQuests.length === 0) {
        generateNewSelfQuests();
      }

      player.currentSelfQuests.forEach((quest, idx) => {
        const div = document.createElement('div');
        div.className = 'quest-item';
        div.innerHTML = `<input type="checkbox" ${quest.completed ? 'checked' : ''} onchange="toggleSelfQuest(${idx})"> <span>${quest.text}</span>`;
        container.appendChild(div);
      });
    }

    function toggleQuest(index, type) {
      if (type === 'daily') player.dailyQuests[index].completed = !player.dailyQuests[index].completed;
      saveData();
    }

    function toggleSelfQuest(idx) {
      player.currentSelfQuests[idx].completed = !player.currentSelfQuests[idx].completed;
      saveData();
    }

    function renderWeekly() {
      const container = document.getElementById('weekly-container');
      container.innerHTML = `
        <div class="quest-item">
          <input type="checkbox" ${player.weeklyQuest.completed ? 'checked' : ''} onchange="toggleWeekly()">
          <span>${player.weeklyQuest.text}</span>
        </div>
      `;
    }

    function toggleWeekly() {
      player.weeklyQuest.completed = !player.weeklyQuest.completed;
      saveData();
    }

    function completeDay() {
      let completedCount = player.dailyQuests.filter(q => q.completed).length;
      completedCount += player.currentSelfQuests.filter(q => q.completed).length;

      if (completedCount === 0) {
        alert("Sir, please complete at least one quest before claiming progress.");
        return;
      }

      const pointsEarned = completedCount * 12;
      player.progress += pointsEarned;

      if (player.progress >= 100) {
        const levelsGained = Math.floor(player.progress / 100);
        player.level += levelsGained;
        player.progress %= 100;

        const statKeys = Object.keys(player.stats);
        for (let i = 0; i < 5; i++) {
          const randStat = statKeys[Math.floor(Math.random() * statKeys.length)];
          player.stats[randStat] += 1;
        }
      }

      alert(`Well done, Sir. You earned ${pointsEarned} Progress Points.`);

      // Reset daily quests
      player.dailyQuests.forEach(q => q.completed = false);
      player.currentSelfQuests.forEach(q => q.completed = false);

      // Generate fresh self-development quests for next day
      generateNewSelfQuests();

      saveData();
      updateUI();
    }

    function completeWeekly() {
      if (!player.weeklyQuest.completed) {
        alert("Sir, please mark the weekly quest as completed first.");
        return;
      }

      player.progress += 60;

      if (player.progress >= 100) {
        const levelsGained = Math.floor(player.progress / 100);
        player.level += levelsGained;
        player.progress %= 100;

        const statKeys = Object.keys(player.stats);
        for (let i = 0; i < 7; i++) {
          const randStat = statKeys[Math.floor(Math.random() * statKeys.length)];
          player.stats[randStat] += 1;
        }
      }

      alert("Outstanding achievement, Sir. +60 Progress Points awarded for the weekly quest.");

      player.weeklyQuest.completed = false;
      saveData();
      updateUI();
    }

    function updateUI() {
      document.getElementById('level').textContent = player.level;
      document.getElementById('progress-text').textContent = player.progress;
      document.getElementById('progress-bar').style.width = `${player.progress}%`;
      renderStats();
      renderQuests();
      renderWeekly();
    }

    function resetProgress() {
      if (confirm("Reset all progress, Sir? This cannot be undone.")) {
        localStorage.removeItem('shadowSystem');
        location.reload();
      }
    }

    // Initialize
    loadData();
    updateUI();
  </script>
</body>
</html>
