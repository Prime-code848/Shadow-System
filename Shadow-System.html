<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadow Ascendant Protocol</title>
    <style>
        body { font-family: Arial, sans-serif; background: linear-gradient(#0a0a1f, #000011); color: #a0d8ff; margin: 0; padding: 20px; }
        h1 { text-align: center; color: #00b3ff; text-shadow: 0 0 10px #00b3ff; }
        .container { max-width: 900px; margin: auto; }
        .status { background: #0f1626; padding: 15px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #003366; }
        .stat { margin: 15px 0; }
        .progress { height: 22px; background: #112233; border-radius: 10px; overflow: hidden; border: 1px solid #003366; }
        .bar { height: 100%; background: linear-gradient(to right, #00b3ff, #0088cc); }
        button { background: #003366; color: #a0d8ff; border: 1px solid #00b3ff; padding: 10px 16px; margin: 6px; cursor: pointer; border-radius: 6px; }
        button:hover { background: #006699; }
        .quest { margin: 12px 0; padding: 12px; background: #0f1626; border-radius: 8px; border-left: 4px solid #00b3ff; }
        .log { height: 200px; overflow-y: auto; background: #0a0f1f; padding: 12px; border-radius: 8px; border: 1px solid #003366; }
        textarea { width: 100%; height: 80px; background: #0a0f1f; color: #a0d8ff; border: 1px solid #003366; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Shadow Ascendant Protocol</h1>
        
        <div class="status">
            <p><strong>Overall Level:</strong> <span id="level">1</span> | <strong>Title:</strong> <span id="title">Shadow Novice</span></p>
            <p><strong>Total Shadow Score:</strong> <span id="totalScore">0</span> (Year-End Culmination)</p>
            
            <h3>Health & Mana</h3>
            <div class="stat">Health <div class="progress"><div id="healthBar" class="bar" style="width:100%"></div></div></div>
            <div class="stat">Mana <div class="progress"><div id="manaBar" class="bar" style="width:100%"></div></div></div>
        </div>

        <h2>Core Stats (Available Points: <span id="statPoints">5</span>)</h2>
        <div id="stats"></div>
        <button onclick="allocatePoint('all')">+1 to All Stats</button>

        <h2>Daily Quests - <span id="currentDate"></span></h2>
        <div id="quests"></div>
        
        <button onclick="completeAllQuests()">Complete All Daily Quests</button>
        <button onclick="resetToday()">Reset Today's Progress</button>
        <button onclick="exportData()">Export Progress</button>
        <button onclick="importData()">Import Progress</button>

        <h2>Shadow Log</h2>
        <textarea id="logEntry" placeholder="What improved in the shadows today?"></textarea>
        <button onclick="addLogEntry()">Record Entry</button>
        <div id="log" class="log"></div>
    </div>

    <script>
        let player = {
            level: 1,
            title: "Shadow Novice",
            totalScore: 0,
            health: 100,
            mana: 100,
            statPoints: 5,
            stats: {
                Programming: { value: 1, exp: 0 },
                Hacking: { value: 1, exp: 0 },
                Trading: { value: 1, exp: 0 },
                Knowledge: { value: 1, exp: 0 },
                Discipline: { value: 1, exp: 0 },
                Spiritual: { value: 1, exp: 0 }
            },
            lastDate: "",
            completedQuests: [],
            log: []
        };

        const titles = ["Shadow Novice", "Shadow Walker", "Shadow Caster", "Shadow Weaver", "Shadow Sovereign"];

        const quests = [
            "1 hour Programming practice",
            "30 min Ethical Hacking study",
            "30 min Trading analysis or journal",
            "Read & extract 10 pages from success/spiritual book",
            "20 min Spiritual practice (prayer/reflection)",
            "Maintain good sleep & focus"
        ];

        function saveData() { localStorage.setItem('shadowSystem', JSON.stringify(player)); }
        function loadData() {
            const saved = localStorage.getItem('shadowSystem');
            if (saved) player = JSON.parse(saved);
        }

        function getToday() { return new Date().toISOString().split('T')[0]; }

        function checkDateReset() {
            const today = getToday();
            if (player.lastDate !== today) {
                player.completedQuests = [];
                player.lastDate = today;
                saveData();
            }
        }

        function updateTitle() {
            const tier = Math.min(Math.floor((player.level - 1) / 50), titles.length - 1);
            player.title = titles[tier];
        }

        function renderStatus() {
            document.getElementById('level').textContent = player.level;
            document.getElementById('title').textContent = player.title;
            document.getElementById('totalScore').textContent = player.totalScore;
            document.getElementById('healthBar').style.width = player.health + '%';
            document.getElementById('manaBar').style.width = player.mana + '%';
            document.getElementById('statPoints').textContent = player.statPoints;
        }

        function renderStats() {
            const container = document.getElementById('stats');
            container.innerHTML = '';
            Object.keys(player.stats).forEach(stat => {
                const data = player.stats[stat];
                const html = `
                    <div class="stat">
                        <strong>${stat}</strong> (Lv ${data.value}) 
                        <button onclick="allocatePoint('${stat}')">+1</button>
                        <div class="progress"><div class="bar" style="width:${Math.min(100, data.exp)}%"></div></div>
                    </div>`;
                container.innerHTML += html;
            });
        }

        function allocatePoint(stat) {
            if (player.statPoints <= 0) return;
            if (stat === 'all') {
                Object.keys(player.stats).forEach(s => player.stats[s].value += 1);
            } else {
                player.stats[stat].value += 1;
            }
            player.statPoints--;
            player.totalScore += 10;
            saveData();
            renderStatus();
            renderStats();
        }

        function renderQuests() {
            checkDateReset();
            document.getElementById('currentDate').textContent = new Date().toLocaleDateString();
            const container = document.getElementById('quests');
            container.innerHTML = '';
            quests.forEach((q, i) => {
                const checked = player.completedQuests.includes(i) ? 'checked' : '';
                container.innerHTML += `<div class="quest"><input type="checkbox" ${checked} onchange="toggleQuest(${i})"> ${q}</div>`;
            });
        }

        function toggleQuest(index) {
            if (!player.completedQuests.includes(index)) {
                player.completedQuests.push(index);
                const statKeys = Object.keys(player.stats);
                const relevantStat = statKeys[index % statKeys.length];
                player.stats[relevantStat].exp += 15;
                if (player.stats[relevantStat].exp >= 100) {
                    player.stats[relevantStat].exp = 0;
                    player.stats[relevantStat].value += 1;
                    player.statPoints += 1;
                }
                player.totalScore += 25;
                player.level = Math.floor(player.totalScore / 200) + 1;
                updateTitle();
                saveData();
                renderStatus();
                renderStats();
            }
        }

        function completeAllQuests() {
            player.completedQuests = quests.map((_, i) => i);
            Object.keys(player.stats).forEach(stat => {
                player.stats[stat].exp += 25;
                if (player.stats[stat].exp >= 100) {
                    player.stats[stat].exp -= 100;
                    player.stats[stat].value += 1;
                    player.statPoints += 1;
                }
            });
            player.totalScore += 200;
            player.level = Math.floor(player.totalScore / 200) + 1;
            updateTitle();
            saveData();
            renderStatus();
            renderStats();
            renderQuests();
        }

        function resetToday() {
            player.completedQuests = [];
            saveData();
            renderQuests();
        }

        function addLogEntry() {
            const entry = document.getElementById('logEntry').value.trim();
            if (entry) {
                player.log.unshift(new Date().toLocaleDateString() + ": " + entry);
                if (player.log.length > 30) player.log.pop();
                document.getElementById('logEntry').value = '';
                saveData();
                renderLog();
            }
        }

        function renderLog() {
            document.getElementById('log').innerHTML = player.log.join('<br><br>');
        }

        function exportData() {
            const dataStr = JSON.stringify(player, null, 2);
            const blob = new Blob([dataStr], {type: 'application/json'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'shadow_progress.json';
            a.click();
        }

        function importData() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = e => {
                const reader = new FileReader();
                reader.onload = ev => {
                    player = JSON.parse(ev.target.result);
                    saveData();
                    renderStatus();
                    renderStats();
                    renderQuests();
                    renderLog();
                };
                reader.readAsText(e.target.files[0]);
            };
            input.click();
        }

        // Initialize
        loadData();
        renderStatus();
        renderStats();
        renderQuests();
        renderLog();
    </script>
</body>
</html>
